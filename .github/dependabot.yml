# Weekly dependency updates, grouped so each ecosystem opens at most one
# routine pull request. Security fixes are separate and arrive as soon as
# an advisory is published (repo setting: Dependabot security updates).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: /native
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      flutter-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
