name: Native builds
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  FLUTTER_VERSION: 3.47.7
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --concurrency=2 --timeout 60s
      - name: Match release tag to app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          test "$GITHUB_REF_NAME" = "v$version"
  android:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore dedicated release key
        env:
          KEYSTORE_BASE64: ${{ secrets.VASTRA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing Vastra signing secret'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vastra-release.p12"
          chmod 600 "$RUNNER_TEMP/vastra-release.p12"
          echo "VASTRA_KEYSTORE=$RUNNER_TEMP/vastra-release.p12" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          VASTRA_KEYSTORE_PASSWORD: ${{ secrets.VASTRA_KEYSTORE_PASSWORD }}
          VASTRA_KEY_PASSWORD: ${{ secrets.VASTRA_KEY_PASSWORD }}
          VASTRA_KEY_ALIAS: ${{ secrets.VASTRA_KEY_ALIAS }}
        run: flutter build apk --release
      - name: Package
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          mkdir -p ../outputs/native
          cp build/app/outputs/flutter-apk/app-release.apk "../outputs/native/Vastra-$version-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: outputs/native/*.apk
  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - name: Package portable app and installer
        run: |
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version: (\d+\.\d+\.\d+)').Matches.Groups[1].Value)
          New-Item -ItemType Directory -Force ../outputs/native | Out-Null
          $release = 'build/windows/x64/runner/Release'
          foreach ($dll in @('msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            $source = Join-Path $env:WINDIR "System32/$dll"
            if (Test-Path $source) { Copy-Item $source $release }
          }
          Compress-Archive -Path "$release/*" -DestinationPath "../outputs/native/Vastra-$version-windows-x64-portable.zip"
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) { choco install innosetup -y --no-progress }
          & $compiler /Qp "/DAppVersion=$version" windows/installer/vastra.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          Copy-Item build/installer/*.exe ../outputs/native/
      - name: Install, start and uninstall
        run: |
          $setup = (Get-Item ../outputs/native/*-setup.exe).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer exited $($p.ExitCode)" }
          $appdir = Join-Path $env:LOCALAPPDATA 'Programs/Vastra'
          $app = Start-Process (Join-Path $appdir 'vastra.exe') -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "Vastra exited $($app.ExitCode)" }
          $db = Get-ChildItem $env:APPDATA -Filter vastra.sqlite -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $db) { throw 'Native catalog was not created' }
          Stop-Process -Id $app.Id
          $u = Start-Process (Join-Path $appdir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($u.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (-not (Test-Path $db.FullName)) { throw 'Uninstall deleted catalog data' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: outputs/native/*
  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release
        working-directory: native
      - name: Package
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' native/pubspec.yaml)
          scripts/package-linux.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: outputs/native/*
  linux-smoke:
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04','archlinux:latest']
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - name: Install native runtime and virtual display
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y libgtk-3-0t64 libgl1-mesa-dri libegl1 libgles2 dbus xvfb xauth
          else
            pacman -Syu --noconfirm --needed gtk3 mesa libglvnd dbus xorg-server-xvfb xorg-xauth
          fi
      - name: Launch and exercise installer
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf dist/*.tar.gz
          app=$(find "$PWD" -maxdepth 1 -type d -name 'vastra-*-linux-x64' -print -quit)
          mkdir -p "$PWD/catalog-data"
          set +e
          XDG_DATA_HOME="$PWD/catalog-data" timeout 20 dbus-run-session -- xvfb-run -a "$app/vastra" > app.log 2>&1
          status=$?
          set -e
          cat app.log
          [[ $status == 124 ]] || { echo "Vastra exited early ($status)"; exit 1; }
          ! grep -E 'Unhandled Exception|Vastra startup failed|error while loading shared libraries|symbol lookup error' app.log
          db=$(find "$PWD/catalog-data" -name vastra.sqlite -size +0c -print -quit)
          test -n "$db"
          "$app/install.sh" --prefix "$PWD/test prefix"
          test -x "$PWD/test prefix/bin/vastra"
          "$app/install.sh" --uninstall --prefix "$PWD/test prefix"
          test ! -e "$PWD/test prefix/lib/vastra"
          test -s "$db"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-smoke-${{ strategy.job-index }}
          path: app.log
  arch:
    needs: [linux, linux-smoke]
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - name: Build checksum-pinned Arch package
        shell: bash
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder dist
          cd dist
          runuser -u builder -- makepkg --nodeps --nocheck
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst
  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install dist/*.apk
            adb logcat -c
            adb shell am start -W -n io.github.sudharamachandranrajeev.vastra/.MainActivity
            sleep 15
            adb shell pidof io.github.sudharamachandranrajeev.vastra
            adb logcat -d > android.log
            ! grep -E 'FATAL EXCEPTION|Vastra startup failed|Unhandled Exception' android.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-smoke-log
          path: android.log
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, linux, arch, android-smoke, linux-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{android,windows,linux,arch}'
          merge-multiple: true
          path: dist
      - name: Create checksums and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum *.apk *.exe *.zip *.tar.gz *.pkg.tar.zst PKGBUILD > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --verify-tag --prerelease --title "Vastra ${GITHUB_REF_NAME#v}" --notes 'Standalone Android, Windows and Linux apps. Includes a signed Android APK, Windows installer and portable ZIP, Linux tarball with a per-user installer, and a checksum-pinned Arch package. Native catalogs are stored locally and are separate from the hosted web catalog. Windows builds are not code-signed.'
