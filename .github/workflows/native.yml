name: Native checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format -l 110 --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --concurrency=2 --timeout 60s
